name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # ──────────────────────────────────────────────────────────────────────
  # Deployment target. Two modes, pick ONE block (see README → Déploiement).
  #
  # 1) GitHub Pages project URL (default while DNS is not ready):
  #      https://djamelpf.github.io/lbn-consulting/
  SITE_URL: https://djamelpf.github.io
  BASE_PATH: /lbn-consulting
  CUSTOM_DOMAIN: ""
  #
  # 2) Custom domain (once www.lbn-consulting.com points to GitHub Pages):
  # SITE_URL: https://www.lbn-consulting.com
  # BASE_PATH: /
  # CUSTOM_DOMAIN: www.lbn-consulting.com
  # ──────────────────────────────────────────────────────────────────────

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add CNAME for the custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
